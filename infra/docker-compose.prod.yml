services:
  backend:
    build:
      target: production
    volumes: []
    restart: always

  worker:
    build:
      target: production
    command: ["node", "dist/workers/main.js"]
    volumes: []
    restart: always

  frontend:
    build:
      target: production
    volumes: []

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
