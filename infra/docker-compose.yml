services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: itsm
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d itsm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - itsm-internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - itsm-internal

  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-3600}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-28800}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_TLS: ${SMTP_TLS:-true}
      CASI_BASE_URL: ${CASI_BASE_URL}
      CASI_TENANT_ID: ${CASI_TENANT_ID}
      CASI_CLIENT_ID: ${CASI_CLIENT_ID}
      CASI_CLIENT_SECRET: ${CASI_CLIENT_SECRET}
      CASI_SCOPE: ${CASI_SCOPE}
      CASI_AUTH_KEY_REST_API: ${CASI_AUTH_KEY_REST_API}
      CASI_SUBSCRIPTION_KEY: ${CASI_SUBSCRIPTION_KEY}
      CASI_DEFAULT_COD_DOMINIO: ${CASI_DEFAULT_COD_DOMINIO:-1}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      APP_PORT: ${APP_PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ADMIN_MATRICULA: ${SEED_ADMIN_MATRICULA}
      SEED_ADMIN_NOME: ${SEED_ADMIN_NOME}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - itsm-internal
    volumes:
      - ../apps/backend:/app
      - /app/node_modules

  worker:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    command: ["node", "--import", "tsx", "src/workers/main.ts"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CASI_BASE_URL: ${CASI_BASE_URL}
      CASI_TENANT_ID: ${CASI_TENANT_ID}
      CASI_CLIENT_ID: ${CASI_CLIENT_ID}
      CASI_CLIENT_SECRET: ${CASI_CLIENT_SECRET}
      CASI_SCOPE: ${CASI_SCOPE}
      CASI_AUTH_KEY_REST_API: ${CASI_AUTH_KEY_REST_API}
      CASI_SUBSCRIPTION_KEY: ${CASI_SUBSCRIPTION_KEY}
      CASI_DEFAULT_COD_DOMINIO: ${CASI_DEFAULT_COD_DOMINIO:-1}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - itsm-internal
    volumes:
      - ../apps/backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    environment:
      VITE_API_URL: /api
    networks:
      - itsm-internal
    volumes:
      - ../apps/frontend:/app
      - /app/node_modules

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - itsm-internal

volumes:
  postgres_data:
  redis_data:

networks:
  itsm-internal:
    driver: bridge
